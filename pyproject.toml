[project]
name = "declivity"
version = "0.1.0"
description = "Unified benchmarking framework for evolutionary and quasi-Newton optimization algorithms (DES, CMA-ES, MF-CMA-ES, L-BFGS-B)"
authors = [
    {name = "Jedrzej Grabski", email = "grabski.dev@gmail.com"},
]
dependencies = [
    "numpy>=2.2.5",
    "matplotlib>=3.10.3",
    "scipy>=1.15.3",
    "pandas>=2.3.0",
    "joblib>=1.5.3",
    "cecpy>=0.1.7",
    "pyyaml>=6.0.3",
    "hydra-core>=1.3.5",
    "hydra-submitit-launcher>=1.2.0",
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
keywords = [
    "optimization",
    "benchmarking",
    "evolutionary-algorithms",
    "cma-es",
    "l-bfgs-b",
    "des",
    "quasi-newton",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/jedrzej-grabski/declivity"
Repository = "https://github.com/jedrzej-grabski/declivity"
Issues = "https://github.com/jedrzej-grabski/declivity/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["declivity/"]

[tool.hatch.build.targets.sdist]
# The wheel `include` above scopes only the wheel. Without this the sdist
# defaults to every non-ignored file, which pulls in the vendored .agents
# tree and a 5 MB PDF under docs/.
include = ["declivity/", "README.md", "LICENSE"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".agents"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "C4",
    "SIM",
    "RUF012",
    "RUF022",
    "RUF100",
]
# SIM300 reads the uppercase math-notation operands used throughout the
# algorithm ports (P, B, D, C) as constants and flags faithful comparisons.
ignore = ["SIM300"]

[tool.ruff.lint.per-file-ignores]
# Line-by-line ports of external sources: keep their control flow and local
# names as written so they stay diffable against the original.
"declivity/algorithms/*/*_reference.py" = ["F841", "SIM103"]
"declivity/utils/line_search/derivative_free.py" = ["SIM108", "SIM109"]

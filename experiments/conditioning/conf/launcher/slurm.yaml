# @package _global_
# One SLURM array task per (dim, variant) cell; joblib parallelizes seeds
# across cpus_per_task within the task. Select with `launcher=slurm`.
# Values below target the PLGrid cluster (plgcmaes26 allocation); adjust the
# account/partition/qos for a different site.
#
# QOS plgrid1 caps this account at MaxJobsPU=10 (concurrently running) and
# MaxSubmitJobsPU=40 (running + pending combined) -- array elements count
# individually the instant they're submitted, and an over-limit array is
# rejected whole, not partially. Any -m sweep submitted as one array must
# stay well under 40 elements, with headroom for anything else running
# concurrently (exp1's grid, an interactive session, ...). exp2's grid
# exceeds this and batches across multiple sequential array submissions
# instead -- see exp2_submit_grid.sh. Re-check these limits periodically
# (e.g. via `scontrol show assoc_mgr qos=plgrid1`) since they can change.
defaults:
  - override /hydra/launcher: submitit_slurm

# Keep joblib's worker count equal to the SLURM allocation so it uses the
# whole task (this is a _global_ config field, not a launcher param).
num_workers: 25

hydra:
  launcher:
    account: plgcmaes26
    partition: plgrid
    qos: plgrid1
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    name: ${hydra.job.name}

    # Per-task resources. num_workers above should equal cpus_per_task.
    cpus_per_task: 25
    gpus_per_node: null
    # Light CPU workload (small dim x dim matrices per worker), but give the
    # 25 workers headroom rather than the 1 GB the reference GPU job used.
    mem_gb: 8
    tasks_per_node: 1
    nodes: 1

    # submitit maps timeout_min -> --time; the explicit HH:MM:SS wins here.
    additional_parameters:
      time: "72:00:00"

    # How many array tasks SLURM runs concurrently. Capped below MaxJobsPU=10
    # (see the QOS note above) with 2 slots of headroom for anything else
    # you're running concurrently (an interactive session, a second sweep).
    array_parallelism: 8

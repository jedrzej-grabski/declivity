# @package _global_
# Small local smoke test: a handful of functions/seeds, short probe budget.
# Pair with `dim=10` (the schema default) for a fast single-cell run.
study_name: demo
functions: [1, 3, 5]
num_seeds: 5
rotate: false
ks: [0.5, 1.0, 2.0, 4.0]
granularity: 0.5
cmaes_evaluations_per_dim: 1500
optimizers: [lbfgsb, bfgs, powell, neldermead]
transform: inverse
scalings: [none, unit]
population_factor: 4.0
probe_budget_per_dim: 150
